<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>특별한 초대장</title>
  
  <meta property="og:title" content="청년부 특별 초대장" />
  <meta property="og:description" content="봉투를 터치하여 초대장을 열어보세요!" />

  <style>
    :root {
      --bg-color: #f7f4ed;
      --env-base: #c59f81;
      --env-dark: #b08667;
      --env-flap: #bb9071;
      --letter-bg: #ffffff;
      --accent: #8e3232;
      --btn-bg: #222222;
      --btn-text: #ffffff;
      
      --env-width: min(92vw, 420px);
      --env-height: calc(var(--env-width) * 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      overflow-x: hidden;
      padding-bottom: max(35px, 6vh);
    }

    .hint-text {
      font-size: 1rem;
      font-weight: 500;
      color: #777;
      letter-spacing: -0.3px;
      margin-bottom: 24px;
      animation: pulse 1.8s infinite;
      transition: opacity 0.3s ease;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* 봉투 래퍼 */
    .envelope-container {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      cursor: pointer;
    }

    /* 봉투 뒷면 */
    .envelope-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--env-dark);
      border-radius: 12px;
      z-index: 1;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    /* 편지지 */
    .letter {
      position: absolute;
      left: 4%;
      top: 3%;
      width: 92%;
      height: calc(var(--env-width) * 1.35);
      background: var(--letter-bg);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      z-index: 2;
      opacity: 0;
      transform: translateY(0);
      transition: transform 0.75s cubic-bezier(0.25, 1, 0.5, 1), 
                  opacity 0.25s ease, 
                  z-index 0s 0.35s;
      pointer-events: none;
    }

    .letter-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 편지지 하단 버튼 그룹 (단일 버튼) */
    .letter-btn-wrap {
      position: absolute;
      bottom: 16px;
      left: 0;
      width: 100%;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 18px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25);
      letter-spacing: -0.3px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .action-btn:hover {
      background-color: #333333;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* 봉투 앞면 포켓 */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--env-base);
      clip-path: polygon(0 100%, 100% 100%, 100% 45%, 50% 15%, 0 45%);
      border-radius: 0 0 12px 12px;
      z-index: 4;
      pointer-events: none;
    }

    /* 봉투 덮개 */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--env-flap);
      border-radius: 12px 12px 0 0;
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      transform-origin: top center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.2s;
      z-index: 5;
    }

    /* 실링 왁스 */
    .seal {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 44px;
      height: 44px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.9rem;
      font-weight: bold;
    }

    /* 열림 상태 */
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      border-radius: 0;
      z-index: 1;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.2s;
    }

    .envelope-container.open .letter {
      opacity: 1;
      transform: translateY(calc(-1 * var(--env-width) * 0.85));
      z-index: 6;
      pointer-events: auto;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.35s, 
                  opacity 0.2s ease 0.3s, 
                  z-index 0s 0.35s;
    }
  </style>
</head>
<body>

  <div class="hint-text" id="hint">봉투를 터치하여 초대장을 열어보세요</div>

  <div class="envelope-container" id="envelope">
    <div class="letter">
      <!-- 캔바에서 제작한 이미지 -->
      <img src="https://i.imgur.com/Z3Q0U7R.png" alt="나들이 초대장" class="letter-img" />

      <!-- 지도 바로가기 버튼 1개만 배치 -->
      <div class="letter-btn-wrap">
        <a href="https://map.naver.com" target="_blank" class="action-btn">
          📍 나들이 장소 안내 (지도 보기)
        </a>
      </div>
    </div>

    <div class="envelope-back"></div>
    <div class="envelope-pocket"></div>
    <div class="envelope-flap">
      <div class="seal">✦</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const hint = document.getElementById('hint');
    const actionBtn = document.querySelector('.action-btn');

    // 지도 버튼 클릭 시 봉투가 닫히지 않도록 차단
    actionBtn.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // 봉투 열기/닫기 토글
    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
      if (envelope.classList.contains('open')) {
        hint.textContent = '다시 터치하면 봉투가 닫힙니다';
      } else {
        hint.textContent = '봉투를 터치하여 초대장을 열어보세요';
      }
    });
  </script>
</body>
</html>

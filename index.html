<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>특별한 초대장</title>
  
  <meta property="og:title" content="청년부 특별 초대장" />
  <meta property="og:description" content="봉투를 터치하여 초대장을 열어보세요!" />

  <style>
    :root {
      --bg-color: #f7f4ed;
      --env-base: #c59f81;
      --env-dark: #b08667;
      --env-flap: #bb9071;
      --letter-bg: #ffffff;
      --accent: #8e3232;
      --btn-bg: #222222;
      --btn-text: #ffffff;
      
      /* 봉투 기본 크기: 320px (화면이 작을 때만 줄어듦) */
      --env-width: min(85vw, 320px);
      --env-height: calc(var(--env-width) * 0.68); /* 약 217px */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      overflow-x: hidden;
      padding-bottom: max(40px, 8vh);
    }

    .hint-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: #777;
      letter-spacing: -0.3px;
      margin-bottom: 24px;
      animation: pulse 1.8s infinite;
      transition: opacity 0.3s ease;
      text-align: center;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* 봉투 컨테이너 */
    .envelope-container {
      position: relative;
      width: var(--env-width);
      height: var(--env-height);
      cursor: pointer;
      perspective: 1200px;
    }

    /* 봉투 뒷면 */
    .envelope-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--env-dark);
      border-radius: 10px;
      z-index: 1;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    /* 편지지 영역 */
    .letter {
      position: absolute;
      left: 4%;
      top: 3%;
      width: 92%;
      height: calc(var(--env-width) * 1.3); /* 세로 카드 비율 */
      background: var(--letter-bg);
      border-radius: 8px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
      overflow: hidden;
      z-index: 2;
      opacity: 0;
      transform: translateY(0);
      transition: transform 0.75s cubic-bezier(0.25, 1, 0.5, 1), 
                  opacity 0.25s ease, 
                  z-index 0s 0.35s;
      pointer-events: none;
    }

    .letter img,
    .letter-img {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block !important;
    }

    /* 지도 바로가기 버튼 */
    .letter-btn-wrap {
      position: absolute;
      bottom: 14px;
      left: 0;
      width: 100%;
      padding: 0 14px;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 14px;
      background-color: var(--btn-bg);
      color: var(--btn-text);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: 6px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
      letter-spacing: -0.3px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .action-btn:active {
      transform: scale(0.97);
    }

    /* 봉투 앞면 주머니 */
    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--env-base);
      clip-path: polygon(0 100%, 100% 100%, 100% 45%, 50% 15%, 0 45%);
      border-radius: 0 0 10px 10px;
      z-index: 4;
      pointer-events: none;
    }

    /* 봉투 덮개 */
    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--env-flap);
      clip-path: polygon(0 0, 100% 0, 50% 55%);
      transform-origin: top center;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.2s;
      z-index: 5;
      border-radius: 10px 10px 0 0;
    }

    /* 인장 */
    .seal {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.28), inset 0 0 0 2px rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: bold;
      user-select: none;
      transition: opacity 0.3s ease;
    }

    /* --- 열림 상태 --- */
    .envelope-container.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.2s;
    }

    .envelope-container.open .seal {
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .envelope-container.open .letter {
      opacity: 1;
      /* 편지가 올라오는 거리 */
      transform: translateY(calc(-1 * var(--env-width) * 0.8));
      z-index: 6;
      pointer-events: auto;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.35s, 
                  opacity 0.2s ease 0.3s, 
                  z-index 0s 0.35s;
    }
  </style>
</head>
<body>
  
  <div class="hint-text" id="hint">봉투를 터치하여 초대장을 열어보세요</div>

  <div class="envelope-container" id="envelope">
    <div class="letter">
      <!-- 캔바에서 제작한 이미지 -->
      <img src="https://i.imgur.com/RAdfu1J.png" alt="나들이 초대장" class="letter-img" />

      <!-- 지도 바로가기 버튼 1개만 배치 -->
      <div class="letter-btn-wrap">
        <a href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%EC%88%B2%20%EB%8B%A4%EB%AA%A9%EC%A0%81%EA%B5%AC%EC%9E%A5/place/36487298?c=15.00,0,0,0,dh&placePath=%2Fhome%3Fbk_query%3D%EC%84%9C%EC%9A%B8%EC%88%B2%20%EB%8B%A4%EB%AA%A9%EC%A0%81%EA%B5%AC%EC%9E%A5%26entry%3Dbmp%26from%3Dmap%26fromPanelNum%3D2%26timestamp%3D202609221449%26locale%3Dko%26svcName%3Dmap_pcv5%26searchText%3D%EC%84%9C%EC%9A%B8%EC%88%B2%20%EB%8B%A4%EB%AA%A9%EC%A0%81%EA%B5%AC%EC%9E%A5" target="_blank" class="action-btn">
          📍 나들이 장소 안내 (지도 보기)
        </a>
      </div>
    </div>

    <!-- 봉투 부속 -->
    <div class="envelope-back"></div>
    <div class="envelope-pocket"></div>
    <div class="envelope-flap">
      <div class="seal">✞</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const hint = document.getElementById('hint');
    const actionBtn = document.querySelector('.action-btn');

    if (actionBtn) {
      actionBtn.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    }

    envelope.addEventListener('click', () => {
      envelope.classList.toggle('open');
      if (envelope.classList.contains('open')) {
        hint.textContent = '다시 터치하면 봉투가 닫힙니다';
      } else {
        hint.textContent = '봉투를 터치하여 초대장을 열어보세요';
      }
    });
  </script>
</body>
</html>
